
<!--
  Kalmar area, for visitor markers on the Civilization of Wonders visitors map.
  Map colors are not stored in this file. The Kalmar map module sets
  map-ocean, map-land, and map-coast on the root element.

  Geographic coverage is centered 2 km north of Kalmar city (56.661389 N, 16.362778 E).
  The window is 50 km east-west and 20 km north-south, so the ground aspect is 2.5:1.
  It includes central Kalmar, Lindsdal, the nearby countryside, Kalmarsund, and the
  facing part of Öland. Natural Earth 1:10m was inspected and not used: in that dataset
  the west shore of Öland opposite Kalmar is a single segment about 26 km long.

  Source: European Commission, Eurostat, GISCO, Coastlines 2016, scale 1:1,000,000.
  File: COAS_RG_01M_2016_4326.geojson
  CRS: EPSG:4326 (WGS 84).
  Download: https://gisco-services.ec.europa.eu/distribution/v2/coas/geojson/COAS_RG_01M_2016_4326.geojson
  Dataset page: https://ec.europa.eu/eurostat/web/gisco/geodata/reference-data/administrative-units-statistical-units/coastlines
  License: Eurostat reuse policy. Attribution is required. Downloaded 2026-10-28.
  Geometry is clipped from the published polygons. No coastline was drawn by hand.

  Projection: equirectangular. Longitude is linear in x and latitude is linear in y.
  The longitude span is scaled by cos(center latitude), so one ground kilometer has
  the same length east-west and north-south at the center of the map.

  Bounds, WGS 84 decimal degrees:
    west  = 15.953952
    east  = 16.771604
    south = 56.589524
    north = 56.769186
  viewBox = 0 0 2500 1000

  Marker position for a visitor latitude and longitude:
    x = (longitude - west) / (east - west) * 2500
    y = (north - latitude) / (north - south) * 1000
  A location outside these bounds is outside this map.
-->
